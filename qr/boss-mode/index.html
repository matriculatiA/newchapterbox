<!doctype html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Boss Mode Box — Личен ритуал</title>
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-theme="boss-mode">
  <main class="card">
    <div class="brand-mark"><img src="../../assets/img/logo-white.png" alt="New Chapter"></div>
    <div class="eyebrow">Boss Mode Box · Ритуална карта</div>
    <div class="accent-divider" aria-hidden="true"></div>
    <h1>Ти си точно там, където трябва да бъдеш.</h1>
    <p class="message">Това е личното послание, което подготвихме за теб. Изправи гръб, поеми си дъх и натисни play.</p>

    <div class="player">
      <div class="play-orb">
        <button id="ritual-play" class="play-button" aria-label="Пусни аудио съобщението"
                data-status-idle="Натисни, за да пуснеш"
                data-status-playing="Слуша се..."
                data-status-paused="На пауза"
                data-status-ended="Пусни отново">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
      </div>
      <div id="ritual-status" class="player-status">Натисни, за да пуснеш</div>
      <div class="progress"><div id="ritual-progress-fill" class="progress-fill"></div></div>
      <div id="ritual-time" class="player-time">0:00 / --:--</div>
    </div>

    <p id="ritual-closing" class="closing-message">Ритуалът приключи. Излез и покажи на какво си способна.</p>

    <audio id="ritual-audio" preload="none" src="../../audio/boss-mode.wav"></audio>
    <p class="footer-note">newchapterbox.com/qr/boss-mode</p>
  </main>
  <script src="../../assets/js/player.js"></script>
</body>
</html>
